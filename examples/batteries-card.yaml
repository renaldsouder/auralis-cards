# Carte individuelle Lovelace. Ressource JavaScript : auralis-cards.js.
# Aucune entité n'est obligatoire : la carte trouve seule les piles et les appareils indisponibles.
type: custom:auralis-batteries-card
name: Batteries et alertes
theme: auto
# Pile faible puis critique à partir de ces pourcentages (20 et 10 par défaut).
low_threshold: 20
critical_threshold: 10
# Signale aussi les piles à l'état texte « moyen ».
warn_on_medium: false
# Appareils indisponibles : activé par défaut. include_unknown ajoute les états « unknown »,
# utile pour un capteur qui n'a plus rien envoyé depuis le démarrage.
show_unavailable: true
include_unknown: true
# Domaines surveillés pour l'indisponibilité (liste par défaut).
# unavailable_domains: [sensor, binary_sensor, light, switch, cover, climate, lock, camera, media_player, valve]
# Lignes visibles sur la carte, le reste dans « Voir tout ».
max_items: 6
# Ajoute à la fenêtre une section repliée avec toutes les piles.
show_ok: true
# Entités ou motifs avec * ajoutés à la découverte automatique.
include:
  - sensor.velo_electrique_niveau
# Entités ou motifs retirés de la carte.
exclude:
  - sensor.*_voltage
  - sensor.*_battery_voltage
