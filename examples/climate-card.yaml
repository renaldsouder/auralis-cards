# Carte individuelle Lovelace. Ressource JavaScript : auralis-cards.js.
# Remplacer les entités d'exemple par celles de vos capteurs.
type: custom:auralis-climate-card
name: Températures
theme: carbon
accent_color: "#79D6F2"
card_background:
  mode: gradient
  gradient: "linear-gradient(145deg, #09111A 0%, #0D1822 58%, #081018 100%)"
# Durée des courbes des tuiles, de 1 à 168 heures (24 par défaut).
graph_hours: 24
# Nombre de colonnes de 1 à 6. Sans cette option, les tuiles se répartissent seules.
# columns: 4
# Une batterie est signalée à partir de ce pourcentage (20 par défaut).
low_battery: 20
rooms:
  - name: Salon
    icon: mdi:sofa-outline
    temperature_entity: sensor.salon_temperature
    humidity_entity: sensor.salon_humidite
    battery_entity: sensor.salon_batterie
  - name: Chambre
    icon: mdi:bed-outline
    temperature_entity: sensor.chambre_temperature
    humidity_entity: sensor.chambre_humidite
  - name: Salle de bain
    icon: mdi:shower
    temperature_entity: sensor.salle_de_bain_temperature
  # outdoor: true applique l'échelle extérieure et exclut le capteur de la moyenne.
  - name: Extérieur
    temperature_entity: sensor.exterieur_temperature
    humidity_entity: sensor.exterieur_humidite
    outdoor: true
# Facultatif : paliers de couleur personnalisés. Chaque palier s'applique aux
# températures strictement inférieures à « below » ; le dernier n'a pas de borne.
# thresholds:
#   - below: 18
#     color: "#5AA9FF"
#     label: Froid
#   - below: 22
#     color: "#5BD69B"
#     label: Confort
#   - color: "#FF6B74"
#     label: Chaud
# outdoor_thresholds: [...]   # même format, pour les pièces « outdoor: true »
grid_options:
  columns: full
  rows: auto
