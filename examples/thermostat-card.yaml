# Charger la ressource unique /local/auralis-cards/auralis-cards.js (module).
# Avec HACS, utiliser /hacsfiles/auralis-cards/auralis-cards.js.
# Un seul thermostat : utilisez entity.
# Pour plusieurs thermostats, renseignez entities (ou entity + entities).
type: custom:auralis-thermostat-card
name: Thermostats
theme: carbon
entities:
  - climate.salon
  - climate.chambre
entity_labels:
  climate.salon: Salon
  climate.chambre: Chambre
card_background:
  mode: gradient
  gradient: "linear-gradient(145deg, #09111A 0%, #0D1822 58%, #081018 100%)"
show_grid: false
# Optionnel : photo dans config/www/auralis-cards/images/
# background_image: /local/auralis-cards/images/thermostats.jpg
# background_position: center
# image_opacity: 55
accent_color: "#ffbd78"
