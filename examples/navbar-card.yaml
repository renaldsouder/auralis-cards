# Une seule barre flottante par tableau de bord : si plusieurs vues ont leur carte navbar,
# la barre suit la dernière carte connectée (celle de la vue affichée) et reste en place
# d'une vue à l'autre, sans clignoter ni perdre son défilement.
type: custom:auralis-navbar-card
theme: carbon
position: bottom  # inline, top, bottom, left ou right ; left et right réservent 176 px à côté du menu latéral
phone_position: bottom
tablet_position: right  # tablette Android, portrait et paysage
height_desktop: 76  # largeur > 1024 px
height_tablet: 72   # largeur de 601 à 1024 px
height_mobile: 56   # largeur <= 600 px ; minimum 56
hide_native_header: true  # masque l'en-tête natif hors mode édition, sauf aux administrateurs
accent_color: "#79D6F2"
show_labels: true
compact: true
grid_options:
  rows: auto

items:
  - label: Accueil
    icon: mdi:home-outline
    path: /dashboard-auralis/accueil

  - label: Pièces
    icon: mdi:floor-plan
    path: /dashboard-auralis/pieces
    active_paths:
      - /dashboard-auralis/salon
      - /dashboard-auralis/cuisine

  - label: Systèmes
    icon: mdi:server-network
    path: /dashboard-auralis/systemes
    badge_entity: sensor.systemes_en_alerte

  - label: Énergie
    icon: mdi:lightning-bolt-outline
    path: /dashboard-auralis/energie
    exact: true
