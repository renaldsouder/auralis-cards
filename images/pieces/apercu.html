<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fonds Auralis — pièces</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #080e16; color: #f4f7fb; }
    main { max-width: 1440px; margin: auto; padding: clamp(20px, 4vw, 56px); }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 3.5vw, 44px); letter-spacing: -.04em; }
    p { margin: 0 0 32px; color: #9aabba; line-height: 1.5; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 310px), 1fr)); gap: 20px; }
    figure { margin: 0; overflow: hidden; border: 1px solid #263545; border-radius: 20px; background: #121e2a; }
    img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
    figcaption { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px 15px; }
    strong { font-size: 15px; }
    a { color: #8bd7ef; font-size: 12px; text-decoration: none; white-space: nowrap; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Fonds des pièces</h1>
